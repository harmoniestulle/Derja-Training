<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2a1220"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>Derja-Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Layout: Leoparden-Kopfband mit persönlicher Begrüßung, drei Menüpunkte, ein großer „Weiter“-Knopf. Pink und Türkis als Knopffarben, Gold als Fell. */
:root{
  --bg:#fff3f8;--card:#ffffff;--ink:#2a1220;--mute:#6b4a5c;--accent:#d6247a;--accent2:#0f9d8e;--accent-ink:#ffffff;
  --tint:#ffe3f0;--line:#f0c2da;--ok:#17713f;--okbg:#e0f2e7;--part:#7a5200;--partbg:#fbeed0;--bad:#a8261d;--badbg:#fbe4e1;
  --font-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-ar:"Amiri","Noto Naskh Arabic","Scheherazade New",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1a0c15;--card:#2a1623;--ink:#fdeff6;--mute:#d6b3c5;--accent:#ff5ea8;--accent2:#3fd6c4;--accent-ink:#2a0a1a;
  --tint:#3d1d30;--line:#5e3049;--ok:#72d69c;--okbg:#16332a;--part:#f0c262;--partbg:#3a2f12;--bad:#ff9d93;--badbg:#3b1f1c;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1a0c15;--card:#2a1623;--ink:#fdeff6;--mute:#d6b3c5;--accent:#ff5ea8;--accent2:#3fd6c4;--accent-ink:#2a0a1a;
  --tint:#3d1d30;--line:#5e3049;--ok:#72d69c;--okbg:#16332a;--part:#f0c262;--partbg:#3a2f12;--bad:#ff9d93;--badbg:#3b1f1c;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:19px/1.55 var(--font-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 64px}
#app{max-width:720px;margin:0 auto}
h2{font-size:1.35rem;margin:22px 0 8px;line-height:1.25;text-wrap:balance}
h3{font-size:1.05rem;margin:22px 0 6px;color:var(--accent);letter-spacing:.02em}
p{margin:8px 0}
.mute{color:var(--mute);font-size:.9rem}
/* Leopardenfell */
.hero{border-radius:20px;overflow:hidden;margin:4px 0 14px;background:linear-gradient(135deg,#d8a24a,#b57a2c);background-image:linear-gradient(95deg,rgba(38,8,24,.78),rgba(38,8,24,.28) 70%,rgba(38,8,24,.08)),var(--leo-gold,none);background-size:auto,420px;box-shadow:0 6px 18px rgba(90,20,60,.25)}
.hero-in{padding:20px 20px 18px;color:#fff;text-shadow:0 2px 6px rgba(30,5,20,.8)}
.hero .gr{font-family:var(--font-ar);font-size:2rem;line-height:1.5;direction:rtl;text-align:left;unicode-bidi:isolate}
.hero h1{font-size:1.65rem;margin:0;line-height:1.2;text-wrap:balance}
.hero p{margin:4px 0 0;font-size:.98rem}
.stripe{height:14px;border-radius:7px;margin:4px 0 16px;background:linear-gradient(#d8a24a,#b57a2c);background-image:var(--leo-gold,none);background-size:240px}
nav{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
/* Knöpfe */
button{font:inherit;font-weight:700;font-size:1rem;letter-spacing:.01em;min-height:52px;padding:10px 24px;border-radius:999px;border:2px solid rgba(255,255,255,.6);color:#fff;cursor:pointer;text-shadow:0 1px 3px rgba(70,0,35,.8);
  background-color:var(--accent);background-image:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,0) 50%),linear-gradient(rgba(150,8,80,.5),rgba(150,8,80,.5)),var(--leo-pink,none);background-size:auto,auto,300px;
  box-shadow:0 4px 0 #8a1050,0 9px 16px rgba(120,10,70,.3);transition:transform .08s,box-shadow .08s}
button:hover{filter:brightness(1.07)}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #8a1050,0 3px 8px rgba(120,10,70,.3)}
button.s{background-color:var(--accent2);background-image:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,0) 50%),linear-gradient(rgba(0,72,66,.55),rgba(0,72,66,.55)),var(--leo-teal,none);box-shadow:0 4px 0 #075a51,0 9px 16px rgba(0,80,72,.28);text-shadow:0 1px 3px rgba(0,40,36,.85)}
button.s:active{box-shadow:0 1px 0 #075a51,0 3px 8px rgba(0,80,72,.28)}
button.tab{background:var(--card);color:var(--ink);text-shadow:none;border:2px solid var(--line);box-shadow:0 3px 0 var(--line);min-height:46px;padding:6px 20px}
button.tab[aria-current="page"]{background:var(--tint);border-color:var(--accent);box-shadow:0 3px 0 var(--accent);color:var(--ink)}
button.big{width:100%;font-size:1.3rem;min-height:68px}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--accent2);outline-offset:3px}
button[disabled]{opacity:.5;cursor:default}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:8px;margin:8px 0 6px}
.dot{width:15px;height:15px;border-radius:50%;border:2px solid var(--accent);display:inline-block;margin:0 4px 4px 0}.dot.on{background:var(--accent)}
.wr{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px;margin:14px 0;box-shadow:0 3px 0 var(--line)}.wr.fin{border-color:var(--ok);box-shadow:0 3px 0 var(--ok)}
.wr .big-ar{font-family:var(--font-ar);font-size:2.6rem;line-height:1.8;direction:rtl;unicode-bidi:isolate;text-align:right}
.wr .hid{font-size:2.6rem;line-height:1.8;text-align:right;color:var(--mute)}
.wr .row{display:flex;gap:10px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.steps button.tab{padding:6px 8px;min-height:50px;font-size:.95rem}

.scene svg{width:100%;height:auto;display:block;border-radius:14px;border:2px solid var(--line);background:#fbf3e4}
.hs{cursor:pointer;outline:none;-webkit-tap-highlight-color:transparent}
.hs .chk{display:none}.hs.found .chk{display:block}
.hs .hit{stroke:none}.hs:hover .hit{fill:rgba(255,255,255,.22)}
.hs:focus-visible .hit,.hs.sel .hit{stroke:#d6247a;stroke-width:3;fill:rgba(255,255,255,.18)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0}
.box{background:var(--tint);border-radius:14px;padding:12px 16px;margin:14px 0}
.ar{font-family:var(--font-ar);direction:rtl;unicode-bidi:isolate;line-height:2;font-size:2.1rem}
.tri{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 16px;margin:10px 0}
.tri .r{display:grid;grid-template-columns:9.5rem 1fr;gap:8px;align-items:baseline;padding:2px 0}
.tri .l{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.tri .r.a .v{font-family:var(--font-ar);direction:rtl;unicode-bidi:isolate;text-align:right;font-size:2.1rem;line-height:1.9}
.tri .tr{font-weight:700;font-size:1.15rem}
.flag{font-size:.8rem;color:var(--part);background:var(--partbg);border-radius:6px;padding:1px 8px;display:inline-block;margin-top:2px}
@media(max-width:480px){.tri .r{grid-template-columns:1fr;gap:0}}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--line);padding:8px 8px;text-align:left;vertical-align:middle}
th{font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mute)}
td.a{font-family:var(--font-ar);direction:rtl;text-align:right;font-size:1.9rem;line-height:1.8}
td.t{font-weight:700}
.bad-ex{color:var(--bad);font-weight:700}
.good-ex{color:var(--ok);font-weight:700}
ul{padding-left:1.2em;margin:6px 0}
li{margin:4px 0}
.task{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:16px 0;box-shadow:0 3px 0 var(--line)}
.task .h{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:4px}
.pill{font-size:.8rem;font-weight:700;border-radius:99px;padding:3px 12px;color:#fff;white-space:nowrap;text-shadow:0 1px 2px rgba(30,5,20,.8);background-color:#b57a2c;background-image:linear-gradient(rgba(38,8,24,.55),rgba(38,8,24,.55)),var(--leo-gold,none);background-size:auto,240px}
.pill.rep{background-image:linear-gradient(rgba(150,8,80,.55),rgba(150,8,80,.55)),var(--leo-pink,none)}
.q{margin:6px 0 10px}
input.in{width:100%;font:inherit;font-size:1.2rem;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
input.in.arin{font-family:var(--font-ar);font-size:1.7rem;direction:rtl;text-align:right}
.btns{display:flex;flex-wrap:wrap;gap:10px 12px;margin:14px 0 6px}
.fb{border-radius:12px;padding:10px 14px;margin-top:10px}
.fb.ok{background:var(--okbg);color:var(--ok)}.fb.part{background:var(--partbg);color:var(--part)}.fb.bad{background:var(--badbg);color:var(--bad)}
.fb b{display:block}
.fb .d{color:var(--ink);font-weight:400;display:block}
.sol{border-left:5px solid var(--accent2);padding-left:12px;margin-top:10px}
.badge{font-size:.8rem;font-weight:700;border-radius:99px;padding:2px 10px;white-space:nowrap}
.b-Neu{background:var(--tint);color:var(--mute)}.b-In{background:var(--partbg);color:var(--part)}.b-Wie{background:var(--badbg);color:var(--bad)}.b-Sicher{background:var(--okbg);color:var(--ok)}
.units{list-style:none;padding:0;margin:4px 0}
.units li{display:flex;gap:10px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:8px 0;margin:0}
.units .n{flex:1;min-width:0}
.units .id{font-weight:700;margin-right:8px}
.units .off{color:var(--mute)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:10px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.stat b{display:block;font-size:1.7rem;line-height:1.2;font-variant-numeric:tabular-nums;color:var(--accent)}
textarea{width:100%;min-height:110px;font:.85rem/1.4 ui-monospace,monospace;background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:8px}
.bar{height:14px;background:var(--tint);border-radius:7px;overflow:hidden;margin:4px 0 8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
details.card>summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}
.next{text-align:center}
.next .mute{margin:0 0 8px}

/* ===== Fell-Design (echtes Leopardenfell, überall) ===== */
:root{--panel:rgba(255,246,251,.95);--furedge:#2a140a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--panel:rgba(26,12,21,.94)}}
:root[data-theme="dark"]{--panel:rgba(26,12,21,.94)}
body{background-color:#7a4a1a;background-image:var(--leo-gold,none);background-size:480px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-block:10px 40px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body{background-image:var(--leo-dark,none);background-color:#2a170a}}
:root[data-theme="dark"] body{background-image:var(--leo-dark,none);background-color:#2a170a}
#app{background:var(--panel);border-radius:24px;padding:12px 14px 24px;box-shadow:0 0 0 3px var(--furedge),0 12px 34px rgba(25,6,0,.5)}
.hero{background-image:linear-gradient(95deg,rgba(25,6,2,.74),rgba(25,6,2,.22) 72%,rgba(25,6,2,.04)),var(--leo-gold,none);background-size:auto,480px;box-shadow:0 0 0 2px var(--furedge),0 6px 18px rgba(60,15,0,.35)}
nav{background-color:#3a2412;background-image:var(--leo-dark,none);background-size:400px;padding:9px;border-radius:18px;box-shadow:0 0 0 2px var(--furedge),inset 0 -3px 8px rgba(0,0,0,.35)}
nav button.tab{border-color:rgba(255,215,140,.55)}
.stripe{height:16px;background-color:#c43a85;background-image:var(--leo-pink,none);background-size:360px;box-shadow:0 0 0 2px #7a1650}
.card,.task,.wr,.tri{position:relative}
.card{overflow:hidden}
.card::before{content:"";display:block;height:14px;margin:-14px -16px 12px;background-color:#3a2412;background-image:var(--leo-dark,none);background-size:360px;border-bottom:2px solid #d9a55c}
details.card::before{display:none}
details.card{padding-top:14px;background-color:#3a2412;background-image:linear-gradient(var(--card),var(--card)),var(--leo-dark,none);background-size:100% calc(100% - 14px),360px;background-repeat:no-repeat,repeat;background-position:0 100%,0 0;border-top:0}
.task,.wr{border-left:10px solid #3a2412;box-shadow:0 3px 0 var(--line),-3px 0 0 #d9a55c inset}
.tri{border-left:6px solid #c98c3a}
.box{border:2px solid #c98c3a}
.bar{height:18px;background-color:#3a2412;background-image:var(--leo-dark,none);background-size:300px;border-radius:9px;box-shadow:0 0 0 2px #d9a55c}
.bar i{background-color:#e4519a;background-image:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 55%),var(--leo-pink,none);background-size:auto,300px;border-right:2px solid #fff}
.units li{border:0;border-left:8px solid #3a2412;border-radius:10px;padding:8px 10px;margin:6px 0;background:var(--tint);box-shadow:inset 0 0 0 1px var(--line)}
.pill{background-color:#7a1650;background-image:linear-gradient(rgba(38,8,24,.5),rgba(38,8,24,.5)),var(--leo-gold,none);background-size:auto,240px}
button.tab[aria-current="page"]{background-color:var(--tint);background-image:linear-gradient(color-mix(in srgb,var(--tint) 86%,transparent),color-mix(in srgb,var(--tint) 86%,transparent)),var(--leo-pink,none);background-size:auto,260px;box-shadow:0 3px 0 var(--accent)}
.next{background-color:var(--card)}
.next::before{height:22px;margin-top:-14px}
button.big{background-size:auto,auto,360px;border-width:3px}
button{box-shadow:0 4px 0 #8a1050,0 9px 16px rgba(120,10,70,.3),inset 0 0 0 1px rgba(255,255,255,.25)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tri,:root:not([data-theme="light"]) .box{border-color:#7d5026}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.ind-scene .hs{opacity:.42;pointer-events:none}.ind-scene .hs.act{opacity:1;pointer-events:auto}.ind-scene .hs.act .hit{stroke:#d6247a;stroke-width:3;stroke-dasharray:7 4}.ind-scene .chk{display:none!important}
.hero-in{position:relative}.hero .thm{position:absolute;top:10px;right:10px;min-height:40px;padding:4px 12px;font-size:.85rem;background:rgba(255,255,255,.92);color:#2a1220}
@media (max-width:420px){.hero .gr{padding-right:96px}}
a{color:var(--accent)}

/* HUB */
.hero.mini .hero-in{padding:12px 16px 10px}.hero.mini h1{font-size:1.4rem;padding-right:52px}.hero.mini .sub{font-size:.9rem;margin:2px 0 0}.hero.mini .thm{top:8px;right:8px;min-height:40px;padding:2px 10px;font-size:1.2rem}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0 14px}
button.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:128px;padding:10px 8px;border-radius:24px;text-align:center;line-height:1.2}
button.tile .ic{font-size:2.3rem;line-height:1}button.tile .tt{font-size:1.08rem;font-weight:800}button.tile .ds{font-size:.82rem;font-weight:400}
button.tile.off{filter:grayscale(.8) brightness(.8);cursor:default}
.tiles.sm button.tile{min-height:96px}.tiles.sm .ic{font-size:1.7rem}.tiles.sm .tt{font-size:.98rem}
.hubnav{display:flex;flex-wrap:nowrap;gap:5px;padding:7px}.hubnav button.tab{flex:1;min-width:0;padding:4px 2px;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;border-radius:16px}
.hubnav .ic{font-size:1.35rem;line-height:1.1}.hubnav .nl{font-size:.62rem;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.chips button.tab{min-height:44px;padding:4px 12px}
.opts,.spot{display:flex;flex-direction:column;gap:10px;margin:10px 0}
button.opt{background:var(--card);color:var(--ink);text-shadow:none;border:2px solid var(--line);box-shadow:0 3px 0 var(--line);background-image:none;border-radius:16px;min-height:56px;text-align:center;font-weight:600}
button.opt.ok{background:var(--okbg);border-color:var(--ok);color:var(--ink)}button.opt.bad{background:var(--badbg);border-color:var(--bad);color:var(--ink)}button.opt.sel{border-color:var(--accent);background:var(--tint)}
.aro{font-family:var(--font-ar);font-size:1.6rem;line-height:1.5}.arq{font-family:var(--font-ar);font-size:2.2rem;text-align:center;margin:8px 0}.arq.tr{font-family:var(--font-body);font-size:1.5rem}.gap{display:inline-block;min-width:3ch;border-bottom:3px solid var(--accent)}
.pxhead{display:flex;align-items:center;gap:10px;margin:6px 0 10px}.pxhead b{flex:1}.timer{font-weight:800;font-size:1.2rem;color:var(--accent)}
.slot{min-height:56px;border:2px dashed var(--line);border-radius:14px;padding:8px;margin:8px 0}.chipbox{display:flex;flex-wrap:wrap;gap:8px}
button.chip{min-height:48px;padding:6px 16px}.chip.on{display:inline-block;background:var(--tint);border-radius:999px;padding:6px 14px;font-weight:700}
.mem{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:10px 0}button.mc{min-height:84px;border-radius:18px;font-size:.98rem;padding:6px}button.mc.open,button.mc.ok{background:var(--card);color:var(--ink);text-shadow:none;background-image:none;border-color:var(--accent)}button.mc.ok{background:var(--okbg);border-color:var(--ok)}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}.pairs>div{display:flex;flex-direction:column;gap:8px}
.daybars{display:flex;gap:8px;align-items:flex-end;height:130px}.daybars .db{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:.78rem}.daybars i{display:block;width:100%;border-radius:8px 8px 0 0;background:var(--accent)}.daybars em{font-style:normal;color:var(--mute)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.bdg{text-align:center;padding:8px 4px;border-radius:14px;border:2px solid var(--line);opacity:.4;filter:grayscale(1)}.bdg.on{opacity:1;filter:none;border-color:var(--accent);background:var(--tint)}.bdg span{font-size:1.8rem;display:block}.bdg em{font-style:normal;font-size:.78rem;line-height:1.2;display:block}
.lrow{margin:8px 0}.itiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}button.itile{background:#fff8ec;background-image:none;color:var(--ink);text-shadow:none;border:3px solid #e0c48a;border-radius:20px;padding:8px;min-height:130px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 #c9a46a}button.itile svg{width:100%;height:auto;max-height:140px}button.itile.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent),0 4px 0 #c9a46a}.scene svg{filter:saturate(1.2) contrast(1.03)}.picbox{text-align:center;margin:0 0 6px;min-height:60px}.pic.emo{line-height:1.2;display:inline-block}.opts button .pic,.card .btns button .pic{max-height:64px}button.tile.les{min-height:112px}button.tile.les .ds{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}details.part summary{display:block;font-size:1.1rem;padding:6px 0;cursor:pointer}details.part .tiles{margin:12px 0 4px}button.heart{min-height:44px;margin:8px 0}

.cultq{font-size:1.15rem;line-height:1.5;background:#fff7e0;border-left:6px solid #e0a010;border-radius:12px;padding:.7rem .8rem;margin:.3rem 0 .6rem}
.cultbox{margin-top:.6rem}
.shoplist{list-style:none;padding:0;margin:.4rem 0 .8rem}.shoplist li{padding:.35rem .5rem;border-radius:10px;margin:.2rem 0;background:rgba(255,255,255,.7);font-size:1.05rem}.shoplist li.got{background:#dff5e0;text-decoration:line-through;text-decoration-color:#2a8a3a}

function arOnly(fn){return function(o){if(/[A-Za-zāēīūḥṭṣḍẓʿ]/.test(o))return {res:"bad",type:"Arabische Schreibung",msg:"Hier ist arabische Schrift verlangt. Du hast Umschrift getippt."};return fn(o);};}
function setCh(str){var key=function(s){return na(s).replace(/ /g,"").split("").sort().join("");};return arOnly(function(o){return key(o)===key(str)?{res:"ok"}:{res:"bad"};});}
function cha(str){return arOnly(function(o){var m=o.replace(/ڨ/g,"ق").replace(/پ/g,"ب").replace(/ڤ/g,"ف");return na(m).replace(/ /g,"")===na(str).replace(/ /g,"")?{res:"ok"}:{res:"bad"};});}
function any(list){return function(o){var t=o.trim().toLowerCase();return list.indexOf(t)>-1?{res:"ok"}:{res:"bad"};};}

/* ============ Normalisierung und Bewertung ============ */
function nd(s){return String(s).toLowerCase().replace(/[^a-zäöüß ]/g,"").replace(/\s+/g," ").trim();}
function ntTok(t){return t.replace(/e/g,"a").replace(/o/g,"u").replace(/(.)\1+/g,"$1");}
function nt(s){
  s=String(s).toLowerCase().replace(/[ʿʾ’'`´ʻ‘]/g,"").normalize("NFD").replace(/[̀-ͯ]/g,"");
  s=s.replace(/3/g,"").replace(/7/g,"h").replace(/ch/g,"kh").replace(/[-–]/g,"").replace(/[^a-z ]/g," ").replace(/\s+/g," ").trim();
  return s.split(" ").filter(Boolean).map(ntTok).join(" ");
}
function na(s){
  s=String(s).replace(/[ً-ٰٟـ]/g,"").replace(/[أإآٱ]/g,"ا").replace(/ى/g,"ي").replace(/[^ء-ي ]/g," ");
  return s.replace(/\s+/g," ").trim();
}

  var d=inst.def,own=inst.own.trim();
  if(d.check){var r=d.check(own);r.type=r.type||d.errType;return r;}
  if(d.kind==="de"){return {res:"bad",type:d.errType};}
  var isAr=d.kind==="ar";
  if(isAr&&/[A-Za-zāēīūḥṭṣḍẓʿ]/.test(own))return {res:"bad",type:"Arabische Schreibung",msg:"Hier ist arabische Schrift verlangt. Du hast Umschrift getippt."};
  if(!isAr&&/[؀-ۿ]/.test(own))return {res:"bad",type:"Umschrift",msg:"Hier ist Umschrift in lateinischen Buchstaben verlangt. Du hast arabische Schrift getippt."};
  var nf=isAr?na:nt;
  var ot=nf(own).split(" ").filter(Boolean),best=null;
  for(var a=0;a<d.answers.length;a++){
    var et=nf(d.answers[a]).split(" ").filter(Boolean),m=0;
    et.forEach(function(t,i){if(ot[i]===t)m++;});
    var exact=(m===et.length&&ot.length===et.length)||(d.joinOk&&ot.join("").replace(/(.)\1+/g,"$1")===et.join("").replace(/(.)\1+/g,"$1"));
    if(exact){var raw=(isAr?na(d.answers[a])===na(own)&&d.answers[a]!==own:false);return {res:"ok",msg:(isAr?"Die Buchstaben stimmen. Zum Merken, mit Vokalzeichen: "+d.sol.ar:(d.answers[a]!==own?"Buch-Schreibweise: "+d.answers[a]:""))};}
    if(!best||m>best.m)best={m:m,et:et};
  }
  var okp=[],badp=[],conf=false;
  best.et.forEach(function(t,i){if(ot[i]===t)okp.push(i+1);else{badp.push(i+1);if(ot[i]&&PRON.indexOf(ot[i])>-1&&PRON.indexOf(t)>-1)conf=true;}});
  var type=conf?"Verwechslung ähnlicher Formen":d.errType;
  if(isAr&&type!=="Verwechslung ähnlicher Formen"&&best.m<best.et.length&&ot.length===best.et.length)type="Arabische Schreibung";
  if(best.et.length>1&&okp.length>0){
    return {res:"part",type:type,msg:"Wort "+okp.join(" und ")+" stimmt. Wort "+badp.join(" und ")+" stimmt nicht"+(ot.length!==best.et.length?" (erwartet sind "+best.et.length+" Wörter, du hast "+ot.length+")":"")+"."};
  }
  if(ot.length===best.et.length&&best.et.length===1&&!conf&&ot[0]&&ot[0].length>=4&&sim(ot[0],best.et[0])){
    return {res:"part",type:type,msg:"Sehr nah dran. Prüfe die Buchstaben noch einmal."};
  }
  return {res:"bad",type:type,msg:ot.length?"":"Bitte etwas eintippen."};
}
function sim(a,b){ // Abstand 1
  if(a===b)return true;if(Math.abs(a.length-b.length)>1)return false;
  var i=0,j=0,e=0;
  while(i<a.length&&j<b.length){
    if(a[i]===b[j]){i++;j++;continue;}
    e++;if(e>1)return false;
    if(a.length>b.length)i++;else if(a.length<b.length)j++;else{i++;j++;}
  }
  return e+(a.length-i)+(b.length-j)<=1;
}

function addDays(s,n){var p=s.split("-"),d=new Date(+p[0],+p[1]-1,+p[2]+n);return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate());}

function U(id){if(!S.units[id])S.units[id]={learn:false,pa:{},days:{},runs:0};return S.units[id];}

/* ============ Fehler- und Wiederholungslogik ============ */
var INTERVALS=[3,7,14];
function prio(e){var t=td(),over=Math.max(0,daysBetween(e.due,t));return e.count*2+(e.status==="offen"?4:e.status==="verbessert"?1:0)+Math.min(over,10)*0.2;}
function daysBetween(a,b){var x=a.split("-"),y=b.split("-");return Math.round((new Date(+y[0],+y[1]-1,+y[2])-new Date(+x[0],+x[1]-1,+x[2]))/864e5);}
function openErr(e){return e.status!=="sicher"&&(e.status==="offen"||e.due<=td());}
function dueErr(e){return e.status!=="sicher"&&e.due<=td();}
function errFor(baseId){return S.errors.find(function(e){return e.baseId===baseId;});}
function record(inst,res,type,own){
  var d=inst.def,t=td();
  S.stats[res]++;
  var h=S.hist[d.baseId]||(S.hist[d.baseId]={ok:0,part:0,bad:0});h[res]++;
  var un=U(d.unit);un.pa[d.baseId]=true;
  var e=errFor(d.baseId);
  if(res==="ok"){
    un.days[t]=true;
    if(inst.peeked)return;
    if(e){
      if(e.status==="offen"){e.status="verbessert";e.fixedOn=t;e.okStreak=0;e.box=0;e.due=addDays(t,1);e.okTotal=(e.okTotal||0)+1;inst.requeue=true;}
      else{
        e.okTotal=(e.okTotal||0)+1;
        if(t>e.fixedOn){e.okStreak++;e.box=Math.min(e.box+1,3);e.due=addDays(t,INTERVALS[e.box-1]);if(e.okStreak>=2)e.status="sicher";}
      }
    }
  }else{
    var tx=d.sol.tr+" ("+d.sol.ar+")";
    if(e){e.count++;e.status="offen";e.okStreak=0;e.box=0;e.due=addDays(t,1);e.last=t;e.own=own;e.type=type;e.types[type]=(e.types[type]||0)+1;}
    else S.errors.push({id:"e"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),unit:d.unit,baseId:d.baseId,q:stripTags(T[d.baseId].q),label:T[d.baseId].label,own:own,sol:tx,de:d.sol.de,type:type,date:t,last:t,count:1,status:"offen",okStreak:0,okTotal:0,box:0,due:addDays(t,1),shown:0,types:(function(){var o={};o[type]=1;return o;})()});
  }
}
function stripTags(s){return String(s).replace(/<br>/g," ").replace(/<[^>]+>/g,"");}
function pickRepeats(n,exclude){
  var c=S.errors.filter(function(e){return T[e.baseId]&&openErr(e)&&(!exclude||exclude.indexOf(e.baseId)<0);}).sort(function(a,b){return prio(b)-prio(a);}).slice(0,n);
  return c.map(function(e){var pool=T[e.baseId].pool;e.shown=(e.shown||0)+1;return newInst(pool[e.shown%pool.length],"Wiederholung: früherer Fehler, neue Form");});
}
function newInst(def,tag){return {def:def,tag:tag||"",own:"",res:null,type:"",msg:"",peeked:false,solShown:false,last:null,requeue:false};}
function unitStatus(id){
  if(!BUILT[id])return {s:"Neu",built:false};
  var un=U(id),D=UD[id],errs=S.errors.filter(function(e){return e.unit===id;});
  var all=D.prac.concat(D.rev);
  var started=un.learn||Object.keys(un.pa).length>0;
  var done=un.learn&&wrDone(id)&&all.every(function(b){return un.pa[b];});
  var unresolved=errs.some(function(e){return e.status!=="sicher";});
  var needs=errs.some(function(e){return openErr(e);});
  var st="Neu";
  if(started)st="In Bearbeitung";
  if(started&&needs)st="Wiederholen";
  if(done&&!unresolved&&Object.keys(un.days).length>=2)st="Sicher";
  return {s:st,built:true,done:!!done,started:started};
}
function badge(s){var k=s==="Neu"?"Neu":s==="In Bearbeitung"?"In":s==="Wiederholen"?"Wie":"Sicher";return '<span class="badge b-'+k+'">'+s+'</span>';}

function doCheck(sk,i){
  var inst=SES[sk].list[i],el=document.getElementById("in-"+sk+"-"+i);

/* ============================================================
   HUB: Startseite mit sechs Kacheln, gemeinsamer Wortbestand, schwierige Wörter,
   Fortschritt, Übungsmodi und Zeit-Challenge. Nutzt dieselben Aufgaben (T), record() und S.errors.
   Neue Zustände (alle optional, alter Stand bleibt gültig):
   S.hard {trKey:1} manuell markiert · S.vok {trKey:{n,ok,bad,rec,days,seen,last}} · S.rounds [] · S.pb {}
   ============================================================ */
function Hd(){if(!S.hard)S.hard={};return S.hard;}
function VK(){if(!S.vok)S.vok={};return S.vok;}
function RD(){if(!S.rounds)S.rounds=[];if(!S.pb)S.pb={};return S.rounds;}
var SCT={markt:"Markt",alltag:"Alltag",kueche:"Küche",strasse:"Straße",fest:"Feste",natur:"Natur",bau:"Architektur"};
var _W=null,_WK={},_WI={};
function ALLW(){
  if(_W)return _W;
  _W=[];
  Object.keys(BUILT).forEach(function(u){UD[u].words.forEach(function(w,i){
    var k=nt(w[1]);if(_WK[k]){if(na(_WK[k].ar)===na(w[0]))return;k=k+"#"+na(w[0]);if(_WK[k])return;}
    var o={k:k,id:"iv-"+u+"-"+i,ar:w[0],tr:w[1],de:w[2],note:w[3]||"",unit:u,idx:""+i,item:itemFor(w[1]),sc:null,topic:u+" "+UTITLE[u]};
    if(o.item)o.sc=itemSc(o.item);
    _WK[k]=o;_WI[o.id]=o;_W.push(o);});});
  Object.keys(SCT).forEach(function(sc){ordOf(sc).forEach(function(id){
    var it=ITEMS[id],k=nt(it.tr);
    if(_WK[k]&&na(_WK[k].ar)!==na(it.ar)&&_WK[k+"#"+na(it.ar)])k=k+"#"+na(it.ar);
    if(_WK[k]&&na(_WK[k].ar)!==na(it.ar))k=k+"#"+na(it.ar);
    if(_WK[k]){if(!_WK[k].item){_WK[k].item=id;_WK[k].sc=sc;}_WI["k1-"+id]=_WK[k];return;}
    var o={k:k,id:"k1-"+id,ar:it.ar,tr:it.tr,de:it.de,note:UNS,unit:SCU[sc],idx:id,item:id,sc:sc,topic:SCT[sc]};
    _WK[k]=o;_WI[o.id]=o;_W.push(o);});});
  return _W;
}
function wM(w){var m=0;if(w.id.indexOf("iv-")===0)m=iSt(w.unit,"unit").m[w.idx]||0;if(w.item&&w.sc)m=Math.max(m,iSt(null,w.sc).m[w.item]||0);return m;}
function wSkip(w){if(w.id.indexOf("iv-")===0&&iSt(w.unit,"unit").skip&&iSt(w.unit,"unit").skip[w.idx])return true;return !!(w.item&&w.sc&&iSt(null,w.sc).skip&&iSt(null,w.sc).skip[w.item]);}
function wTouched(w){if(wSkip(w))return true;if(w.id.indexOf("iv-")===0&&iSt(w.unit,"unit").m[w.idx]!==undefined)return true;return !!(w.item&&w.sc&&iSt(null,w.sc).m[w.item]!==undefined);}
function wErr(w){return errFor(w.id)||(w.item&&errFor("k1-"+w.item))||null;}
/* 0 neu · 1 kennengelernt · 2 in Übung · 3 sicher */
function wLvl(w){
  var v=VK()[w.k]||{};
  if(wM(w)>=2||((v.rec||0)>=3&&(v.days||0)>=2))return 3;
  if((v.n||0)>0||wTouched(w)||wErr(w))return 2;
  if(v.seen||(w.item&&C().found[w.item]))return 1;
  return 0;
}
function vkSee(tr,ar){var wo=wOf(tr,ar),k=wo?wo.k:nt(tr);if(_WK[k]){var v=VK()[k]||(VK()[k]={n:0,ok:0,rec:0,days:0});if(!v.seen){v.seen=1;}}}
function hardWords(){
  var man=Hd(),res=[];
  ALLW().forEach(function(w){
    var why=null,e=wErr(w);
    if(man[w.k])why="markiert";
    else if(e&&e.status!=="sicher")why="Fehler";
    else if(w.id.indexOf("iv-")===0&&iSt(w.unit,"unit").hard[w.idx])why="Problemwort";
    else if(w.item&&w.sc&&iSt(null,w.sc).hard[w.item])why="Problemwort";
    if(why)res.push({w:w,why:why});});
  return res;
}

  finden:["🔍","Gegenstände finden",5],memory:["🃏","Memory",2],paare:["🔗","Wortpaare verbinden",2],reihe:["🔀","Reihenfolge",5],korrigieren:["🔍","Falsches finden",5],themen:["🗂️","Nach Themen sortieren",8],
  luecke:["🧩","Sätze ergänzen",8],aehnlich:["👯","Ähnliche Wörter",8],mix:["🔀","Gemischte Runde",10],schwer:["💗","Schwierige Wörter",8],
  t30:["⏱️","30 Sekunden",0],t60:["⏱️","60 Sekunden",0],tfast:["🏃","Gegen die Zeit",10],tclean:["🎯","Fehlerfreie Runde",0]

function genQ(type,pool,pref){
  var w;
  switch(type){
    case "erkennen":case "schrift":case "ar":case "aehnlich":case "themen":return mcQ(type,pickW(pool,pref));
    case "finden":{var fp=pool.filter(function(x){return x.item&&x.sc;});if(fp.length<3)fp=ALLW().filter(function(x){return x.item&&x.sc;});var fw=pickW(fp,pref);return {k:"find",w:fw,q:'Finde diesen Gegenstand im Bild:<div class="arq" lang="ar" dir="rtl">'+fw.ar+'</div><div class="arq tr">'+esc(fw.tr)+'</div>',res:null};}
    case "luecke":return gapQ();
    case "reihe":return orderQ();
    case "korrigieren":return spotQ(pool);
    case "memory":return pairsQ(pool,"memory");
    case "paare":return pairsQ(pool,"paare");
    case "recall":return typedQ(pickW(pool,pref));
    case "mix":case "t60":{var r=Math.random(),ts=["erkennen","schrift","ar","de2tr","aehnlich","luecke","recall","reihe","korrigieren"];if(type==="t60")ts=["erkennen","schrift","ar","de2tr","luecke"];var t=ts[Math.floor(Math.random()*ts.length)];return genQ(t==="de2tr"?"de2tr":t,pool,pref);}
    case "schwer":{var hw=hardWords().map(function(x){return x.w;});var t2=Math.random()<.4?"recall":Math.random()<.5?"erkennen":"de2tr";return t2==="recall"?typedQ(pickW(hw,0)):mcQ(t2,pickW(hw,0));}
    default:return mcQ("de2tr",pickW(pool,pref));
  }
}
function pxStart(type){

  if(type==="schwer"){pool=hardWords().map(function(x){return x.w;});if(!pool.length){V.name="hard";render();return;}}
  else if(timed){pool=knownPool(true);if(pool.length<6){PX={type:type,warn:"Für die Zeit-Challenge brauchst du mindestens 6 Wörter, die du schon kennst und die nicht schwierig sind. Lerne erst ein paar Wörter unter 📚 Vokabeln lernen.",qs:[],i:0,done:true,empty:true};render();return;}}
  else pool=knownPool(false);
  PX={type:type,title:info[1],ic:info[0],pool:pool,qs:[],i:0,ok:0,bad:0,streak:0,t0:Date.now(),timed:timed,limit:type==="t30"?30:type==="t60"?60:0,total:info[2],tries:0,wrong:[],typedBusy:false,done:false};
  if(!timed||type==="tfast"){for(var i=0;i<(info[2]||8);i++)PX.qs.push(genQ(type,pool,true));}
  else PX.qs.push(genQ(type,pool,false));

}

  }

}
function pxEnd(){
  if(!PX||PX.done)return;PX.done=true;PX.secs=Math.round((Date.now()-PX.t0)/1000);if(PXT){clearInterval(PXT);PXT=null;}
